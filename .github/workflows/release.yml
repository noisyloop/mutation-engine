name: release
# Builds, tests and packages the plugin for macOS (universal) and Linux.
#   - push a tag like v0.9.0 to publish a GitHub Release with both archives, or
#   - run it manually (workflow_dispatch) to get the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-universal, os: macos-14 }
          - { name: linux-x86_64,    os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev

      - name: Build
        run: |
          # Same commit -> same timestamps inside the archive.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          TARGETS="MutationEngine_VST3 MutationEngineSmoke MutationEngineStress"
          [ "$RUNNER_OS" = "macOS" ] && TARGETS="$TARGETS MutationEngine_AU"
          cmake --build build --config Release --target $TARGETS -j 4
          cmake --build build --config Release -j 4 --target me_dsp_tests me_mutation_tests me_preset_tests

      - name: Test before packaging
        run: |
          ctest --test-dir build --output-on-failure
          $(find build -name MutationEngineSmoke -type f -perm -u+x | head -1)
          $(find build -name MutationEngineStress -type f -perm -u+x | head -1)

      - name: Package
        id: pkg
        shell: bash
        run: |
          VERSION="$(sed -n 's/^project(MutationEngine VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          STAGE="MutationEngine-${VERSION}-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp -R "$(find build -name 'Mutation Engine.vst3' -maxdepth 6 | head -1)" "$STAGE/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$(find build -name 'Mutation Engine.component' -maxdepth 6 | head -1)" "$STAGE/"
            # Ad-hoc signature: required for Apple Silicon to load the binary. (Not notarised: see INSTALL.md.)
            for b in "$STAGE"/*.vst3 "$STAGE"/*.component; do codesign --force --deep --sign - "$b"; done
          fi
          mkdir -p "$STAGE/scripts"; cp scripts/install.sh "$STAGE/scripts/"; cp INSTALL.md README.md LICENSE "$STAGE/"
          {
            echo "Mutation Engine $VERSION"
            echo "commit:    $(git rev-parse HEAD)"
            echo "built:     $(date -u -r "$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ)  (commit time)"
            echo "runner:    $RUNNER_OS $RUNNER_ARCH"
            echo "compiler:  $(c++ --version | head -1)"
            echo "cmake:     $(cmake --version | head -1)"
            echo "JUCE:      $(grep -A3 'FetchContent_Declare(JUCE' CMakeLists.txt | sed -n 's/.*GIT_TAG *//p')"
          } > "$STAGE/BUILDINFO.txt"
          # Deterministic archives: sorted entries, fixed mtime, no owner info.
          if [ "$RUNNER_OS" = "macOS" ]; then
            find "$STAGE" -exec touch -t "$(date -u -r "$SOURCE_DATE_EPOCH" +%Y%m%d%H%M.%S)" {} +
            find "$STAGE" -type f -o -type l | LC_ALL=C sort | zip -X -q -y "$STAGE.zip" -@
            ARCHIVE="$STAGE.zip"
          else
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -cf - "$STAGE" | gzip -n > "$STAGE.tar.gz"
            ARCHIVE="$STAGE.tar.gz"
          fi
          shasum -a 256 "$ARCHIVE" | tee "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Mutation Engine $GITHUB_REF_NAME" --generate-notes --prerelease
          gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.archive }}" "${{ steps.pkg.outputs.archive }}.sha256" --clobber
